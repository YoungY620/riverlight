$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'library'

tasks:
  build:
    command: 'pnpm'
    args: ['exec', 'tsc', '-p', 'tsconfig.json', '--noEmit']
    inputs:
      - 'src/**/*'
      - '*.json'
  typecheck:
    command: 'pnpm'
    args: ['exec', 'tsc', '-p', 'tsconfig.json', '--noEmit']
  test:
    command: 'pnpm'
    args: ['exec', 'vitest', 'run']
